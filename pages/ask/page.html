<!-- Screen "ask": the SikLo assistant. Layout and styles; build.mjs scopes these to this screen. -->
<style>
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--purple-500);outline-offset:2px}
  .screen{width:390px;height:calc(100dvh / var(--z,1));max-height:844px;margin:0 auto;background:var(--white);
    display:flex;flex-direction:column;overflow:hidden}
  .head{padding:calc(24px + env(safe-area-inset-top,0px)) 22px 10px;flex:none;border-bottom:1px solid var(--line)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .mk{width:28px;height:28px}
  .logo .wm{height:26px;width:auto}
  h1{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-top:12px}
  .sub{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:2px}

  /* Conversation */
  .body{flex:1;overflow-y:auto;padding:16px 22px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    display:flex;flex-direction:column;gap:10px}
  .msg{position:relative;max-width:88%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
  @media (prefers-reduced-motion:no-preference){
    .msg.you{animation:askOut .52s cubic-bezier(.18,.9,.24,1) both}
    .msg.siklo{animation:askIn .5s cubic-bezier(.18,.9,.24,1) both}
    .thinking{animation:askIn .4s ease both}
    .thinking i{animation:blink 1.25s ease-in-out infinite}
    .thinking i:nth-child(2){animation-delay:.2s}
    .thinking i:nth-child(3){animation-delay:.4s}
    /* Sending: the arrow flies off and a fresh one comes back */
    .round.send.sent svg{animation:fly .42s cubic-bezier(.3,.7,.3,1) both}
    .round.send.sent{animation:sendPulse .42s ease both}
    /* The field settles back once the question has gone */
    .ask.sent textarea{animation:settle .34s cubic-bezier(.22,.9,.26,1) both}
  }
  /* A question leaves from the right, where it was typed */
  @keyframes askOut{from{opacity:0;transform:translate(34px,10px) scale(.9)}
    60%{opacity:1}to{opacity:1;transform:none}}
  @keyframes askIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  /* The dots rise and fall in turn, so waiting looks like thinking */
  @keyframes blink{0%,70%,100%{opacity:.28;transform:translateY(0) scale(.85)}
    35%{opacity:1;transform:translateY(-5px) scale(1.15)}}
  @keyframes fly{0%{transform:none;opacity:1}45%{transform:translate(22px,-14px) scale(.7);opacity:0}
    55%{transform:translate(-14px,10px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
  @keyframes sendPulse{0%{transform:scale(1)}35%{transform:scale(.88)}100%{transform:scale(1)}}
  @keyframes settle{from{transform:scaleY(.94);opacity:.5}to{transform:none;opacity:1}}
  .msg.you{align-self:flex-end;background:var(--button);color:#fff;border-bottom-right-radius:6px}
  .msg.siklo{align-self:flex-start;background:var(--purple-50);color:var(--ink);border-bottom-left-radius:6px}
  .msg.siklo.crisis{background:var(--flag-bg);border:1px solid var(--flag-line)}
  /* An answer being written out, with a caret while it runs */
  .msg .read{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .msg .said.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;
    background:currentColor;opacity:.75}
  @media (prefers-reduced-motion:no-preference){
    .msg .said.typing::after{animation:caret .85s steps(1,end) infinite}
  }
  @keyframes caret{0%,50%{opacity:.75}51%,100%{opacity:0}}
  .msg .src{display:block;font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
  .msg .mine{display:block;margin-top:9px;padding:9px 11px;border-radius:12px;background:var(--white);font-size:12.5px;line-height:1.5}
  .msg .mine b{display:block;font-size:11.5px;font-weight:700;color:var(--purple-700);margin-bottom:3px}
  .msg .mine em{display:block;font-style:normal;color:var(--body)}
  .msg .mine em + em{margin-top:4px}
  .msg .note{display:block;font-size:11.5px;color:var(--body);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.45}
  .thinking{align-self:flex-start;display:flex;align-items:center;gap:5px;padding:14px 16px;
    border-radius:18px;border-bottom-left-radius:6px;background:var(--purple-50)}
  .thinking i{width:7px;height:7px;border-radius:50%;background:var(--purple-500)}

  /* Suggestions */
  .suggest{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 4px}
  .suggest button{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--white);
    font-size:12.5px;font-weight:600;color:var(--purple-700);text-align:left}

  /* Voice + model controls */
  .tools{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .tool{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;border-radius:14px;background:var(--purple-50);text-align:left}
  .tool .ic{flex:none;width:28px;height:28px;border-radius:9px;background:var(--white);color:var(--purple-700);display:grid;place-items:center}
  .tool .ic svg{width:15px;height:15px}
  .tool b{display:block;font-size:13px;font-weight:700}
  .tool small{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:1px}
  .tool .state{flex:none;font-size:11.5px;font-weight:700;color:var(--purple-700)}
  .tool[aria-pressed="true"]{background:var(--purple-100)}
  .tool[disabled]{opacity:.55;cursor:default}
  .bar{height:5px;border-radius:99px;background:var(--white);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;width:0;background:var(--button);transition:width .3s}

  /* Ask row */
  /* Sits just above the tab bar: on this screen the Ask tab is flat, so there is
     no raised button to clear and the conversation gets the extra room. */
  .foot{flex:none;padding:10px 22px calc(74px + env(safe-area-inset-bottom,0px));background:var(--white);
    box-shadow:0 -1px 0 var(--line)}
  .ask{display:flex;align-items:flex-end;gap:8px}
  .ask textarea{flex:1;min-height:48px;max-height:120px;resize:none;padding:13px 14px;border:1px solid var(--line);
    border-radius:16px;background:var(--white);font-size:14.5px;line-height:1.4;outline:none;transition:border-color .15s,box-shadow .15s}
  .ask textarea::placeholder{color:var(--placeholder)}
  .ask textarea:focus{border-color:var(--purple-500);box-shadow:0 0 0 3px var(--purple-100)}
  .round{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--purple-50);color:var(--purple-700)}
  .round svg{width:20px;height:20px}
  .round.send{background:var(--button);color:#fff}
  .round[disabled]{opacity:.4;cursor:not-allowed}
  .round.on{background:var(--purple-900);color:var(--white)}
  .heard{font-size:12px;color:var(--muted);text-align:center;margin-top:7px;min-height:17px;line-height:1.4}
</style>

      <button class="round" type="button" id="clearBtn" aria-label="Clear this conversation" style="width:36px;height:36px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </button>
    </div>
    <h1>Ask SikLo</h1>
    <p class="sub">Questions about cycles, symptoms, or what you have logged. Works offline.</p>
  </header>

  <section class="body" id="thread" aria-live="polite" aria-label="Conversation"></section>

  <footer class="foot">
    <div class="ask">
      <textarea id="input" rows="1" maxlength="400" placeholder="Ask a question…" aria-label="Your question"></textarea>
      <button class="round" type="button" id="micBtn" aria-label="Ask using your voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="round send" type="button" id="sendBtn" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p class="heard" id="heard"></p>
  </footer>

</main>
