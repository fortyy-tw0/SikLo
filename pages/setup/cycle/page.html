<!-- Screen "cycle": its layout and styles. build.mjs puts it in the one-page app and
     limits these styles to this screen, so screens can reuse class names safely. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .screen{width:390px;min-height:calc(100dvh / var(--z,1));margin:0 auto;background:var(--white);padding:28px 22px;display:flex;flex-direction:column}

  /* Top bar (same as landing) */
  .top{display:flex;justify-content:space-between;align-items:center}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .mk{width:32px;height:32px}
  .logo .wm{height:30px;width:auto}

  /* Progress */
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
  .back{display:flex;align-items:center;gap:4px;min-height:44px;font-size:13px;font-weight:600;color:var(--purple-700)}
  .back svg{width:16px;height:16px}
  .step{font-size:12px;font-weight:600;color:var(--muted)}
  .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .bars i{height:4px;border-radius:99px;background:var(--purple-100)}
  .bars i.on{background:var(--purple-700)}

  /* Question */
  h1{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.25;margin-top:26px}
  .lead{font-size:14px;line-height:1.55;color:var(--body);margin-top:8px}

  /* Options */
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;
    border:1px solid var(--line);border-radius:16px;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--purple-300)}
  .radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--purple-300);display:grid;place-items:center;transition:border-color .15s}
  .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--purple-700);transform:scale(0);transition:transform .15s}
  .opt b{display:block;font-size:15px;font-weight:600}
  .opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
  .opt[aria-checked="true"]{border-color:var(--purple-700);background:var(--purple-50)}
  .opt[aria-checked="true"] .radio{border-color:var(--purple-700)}
  .opt[aria-checked="true"] .radio::after{transform:scale(1)}

  /* Reassurance note */
  .note{display:flex;gap:12px;margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--purple-50)}
  .note .ic{flex:none;width:28px;height:28px;border-radius:9px;background:var(--purple-100);color:var(--purple-700);display:grid;place-items:center}
  .note .ic svg{width:15px;height:15px}
  .note b{display:block;font-size:13.5px;font-weight:700;color:var(--purple-900)}
  .note p{font-size:12.5px;line-height:1.5;color:var(--body);margin-top:2px}

  .spacer{flex:1;min-height:24px}

  /* Actions */
  .cta{width:100%;padding:16px;border-radius:16px;background:var(--button);color:#fff;font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,opacity .15s}
  .cta:hover{background:var(--button-hover)}
  .cta[disabled]{opacity:.4;cursor:not-allowed;background:var(--button)}
  .cta svg{width:16px;height:16px}
  .skip{width:100%;padding:14px;margin-top:8px;font-size:14px;font-weight:600;color:var(--purple-700);border-radius:16px}
  .skip:hover{background:var(--purple-50)}
</style>

  </div>

  <div class="nav">
    <button class="back" type="button" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back

  <div class="bars" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on now"></i><i></i><i></i></div>

  <h1>How would you describe your cycles?</h1>
  <p class="lead">Choose the description that feels closest to your experience. This is self-report, not a diagnosis.</p>

  <div class="opts" role="radiogroup" aria-label="Cycle description" id="opts">
    <button class="opt" role="radio" aria-checked="false" data-v="regular">
      <span class="radio"></span><span><b>Regular</b><small>The timing usually feels predictable to me.</small></span>
    </button>
    <button class="opt" role="radio" aria-checked="false" data-v="irregular">
      <span class="radio"></span><span><b>Irregular</b><small>The timing varies or feels hard to predict.</small></span>
    </button>
    <button class="opt" role="radio" aria-checked="false" data-v="unsure">
      <span class="radio"></span><span><b>I'm not sure</b><small>I haven't tracked enough to describe it yet.</small></span>
    </button>
  </div>

  <div class="note">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></div>
    <div>
      <b>There is no right answer</b>
      <p>You can log periods and symptoms with any choice. Irregular does not mean you have a condition.</p>
    </div>
