<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SikLo Profile</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--page-bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

  .screen{width:390px;height:calc(100dvh / var(--z,1));max-height:844px;margin:0 auto;background:var(--white);
    display:flex;flex-direction:column;overflow:hidden}
  .head{padding:calc(28px + env(safe-area-inset-top,0px)) 22px 0;flex:none}
  .body{flex:1;overflow-y:auto;padding:8px 22px 110px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  .top{display:flex;justify-content:space-between;align-items:center}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .mk{width:32px;height:32px}
  .logo .wm{height:30px;width:auto}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--purple-700);
    background:var(--purple-50);padding:7px 12px;border-radius:99px}
  .badge svg{width:12px;height:12px}

  h1{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.25;margin-top:22px}

  .intro{font-size:13.5px;line-height:1.55;color:var(--body);margin-top:8px}

  h2{font-size:15px;font-weight:700;margin-top:26px}
  .hist{list-style:none;margin-top:10px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .hist li{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;font-size:14px;font-variant-numeric:tabular-nums}
  .hist li + li{border-top:1px solid var(--line)}
  .hist li span{color:var(--muted);font-size:13px}
  .hist .empty{color:var(--muted);font-size:13px}

  .acts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
  .btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:12px 16px;
    border-radius:14px;background:var(--purple-50);font-size:14px;font-weight:600;color:var(--ink);transition:background .15s}
  .btn:hover{background:var(--purple-100)}
  .btn svg{width:16px;height:16px;color:var(--purple-700)}
  .appearance{display:flex;justify-content:center;margin-top:10px}
  .wipe{margin-top:6px;min-height:44px;font-size:13.5px;font-weight:600;color:var(--purple-700);border-radius:14px;width:100%}
  .wipe:hover{background:var(--purple-50)}
  .saved{font-size:12px;line-height:1.5;color:var(--muted);text-align:center;margin-top:10px}
  :focus-visible{outline:2px solid var(--purple-500);outline-offset:2px}
</style>
