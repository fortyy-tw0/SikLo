<!-- Screen "calendar": month view of recorded and estimated days. -->
<style>
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--purple-500);outline-offset:2px}
  .screen{width:390px;min-height:calc(100dvh / var(--z,1));margin:0 auto;background:var(--white);
    padding:calc(24px + env(safe-area-inset-top,0px)) 22px 120px}

  .top{display:flex;justify-content:space-between;align-items:center}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .mk{width:28px;height:28px}
  .logo .wm{height:26px;width:auto}
  h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-top:14px}
  .sub{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:3px}

  /* Month navigation */
  .months{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .months b{font-size:15px;font-weight:700}
  .months button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--purple-50);color:var(--purple-700)}
  .months button svg{width:17px;height:17px}
  .months button[disabled]{opacity:.35;cursor:not-allowed}

  /* Grid */
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:14px}
  .dow span{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px}
  .cell{position:relative;aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;font-size:13.5px;font-weight:600;color:var(--ink);background:none}
  .cell.blank{visibility:hidden}
  .cell.future{color:var(--muted)}
  .cell .n{line-height:1}
  .cell .dots{display:flex;gap:2px;height:4px}
  .cell .dots i{width:4px;height:4px;border-radius:50%;background:var(--purple-700)}
  .cell .dots i.heart{background:var(--purple-500)}

  /* Recorded */
  .cell.period{background:var(--purple-300);color:var(--purple-900)}
  .cell.period-start{background:var(--purple-700);color:#fff}
  .cell.period-start .dots i{background:#fff}
  .cell.spotting{box-shadow:inset 0 0 0 2px var(--purple-300)}
  /* Estimated: outlined, never filled, so it reads as a guess */
  .cell.predicted{box-shadow:inset 0 0 0 1.5px var(--purple-300);background:var(--purple-50)}
  .cell.fertile{background:var(--purple-100)}
  .cell.ovulation{box-shadow:inset 0 0 0 2px var(--purple-700)}
  .cell.today{outline:2px solid var(--purple-900);outline-offset:-2px}

  .legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:18px}
  .legend span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--body);line-height:1.3}
  .legend i{flex:none;width:14px;height:14px;border-radius:5px;background:var(--purple-100)}
  .legend i.start{background:var(--purple-700)}
  .legend i.period{background:var(--purple-300)}
  .legend i.predicted{background:var(--purple-50);box-shadow:inset 0 0 0 1.5px var(--purple-300)}
  .legend i.ovulation{box-shadow:inset 0 0 0 2px var(--purple-700)}
  .legend i.today{outline:2px solid var(--purple-900);outline-offset:-2px;background:none}
  .note{font-size:11.5px;line-height:1.5;color:var(--muted);margin-top:14px}

  /* Day sheet */
  .scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;width:390px;transform:translate(-50%,100%);background:var(--white);
    border-radius:24px 24px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom,0px));
    transition:transform .25s ease;z-index:11;visibility:hidden;max-height:86dvh;overflow-y:auto}
  .sheet.show{transform:translate(-50%,0);visibility:visible}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
  .sheet h2{font-size:17px;font-weight:700}
  .sheet .when{font-size:12.5px;color:var(--muted);margin-top:3px}
  .marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .marks span{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--purple-50);color:var(--purple-700)}
  .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .act{display:flex;align-items:center;gap:11px;width:100%;min-height:50px;padding:12px 14px;border-radius:14px;
    background:var(--purple-50);font-size:14px;font-weight:600;text-align:left}
  .act .ic{flex:none;width:26px;height:26px;border-radius:8px;background:var(--white);color:var(--purple-700);display:grid;place-items:center}
  .act .ic svg{width:14px;height:14px}
  .act.danger{color:var(--purple-900)}
  .act[disabled]{opacity:.5;cursor:not-allowed}

  .panel{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .panel h3{font-size:14px;font-weight:700}
  .panel p{font-size:12.5px;line-height:1.5;color:var(--body);margin-top:3px}
  .opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .opt{padding:9px 13px;border-radius:99px;border:1px solid var(--line);background:var(--white);
    font-size:12.5px;font-weight:600}
  .opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--purple-700);background:var(--purple-50);color:var(--purple-700)}
  .panel label{display:block;font-size:12.5px;font-weight:600;margin:13px 0 6px}
  .panel label span{color:var(--muted);font-weight:500}
  .panel textarea{width:100%;min-height:58px;resize:none;padding:11px 13px;border:1px solid var(--line);
    border-radius:13px;background:var(--white);font-size:14px;line-height:1.45;outline:none}
  .panel textarea:focus{border-color:var(--purple-500);box-shadow:0 0 0 3px var(--purple-100)}
  .cta{width:100%;min-height:50px;margin-top:14px;border-radius:15px;background:var(--button);color:#fff;
    font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
  .link{width:100%;min-height:42px;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--purple-700);border-radius:13px}
</style>

  </div>

  <h1>Calendar</h1>
  <p class="sub">Filled days are what you recorded. Outlined days are estimates.</p>

  <div class="months">
    <button type="button" id="prevBtn" aria-label="Previous month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <b id="monthLabel" aria-live="polite"></b>
    <button type="button" id="nextBtn" aria-label="Next month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div class="dow" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
  <div class="grid" id="grid" role="grid" aria-label="Days"></div>

  <div class="legend">
    <span><i class="start"></i>Period started</span>
    <span><i class="period"></i>Period day</span>
    <span><i class="predicted"></i>Period expected</span>
    <span><i></i>Fertile window (estimated)</span>
    <span><i class="ovulation"></i>Ovulation (estimated)</span>
    <span><i class="today"></i>Today</span>
  </div>
  <p class="note" id="estimateNote"></p>

</main>

<nav class="tabbar" id="tabbar" data-current="calendar" aria-label="Main"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate">
  <div class="grab"></div>
  <h2 id="sheetDate"></h2>
  <p class="when" id="sheetWhen"></p>
  <div class="marks" id="sheetMarks"></div>
  <div class="acts" id="sheetActs"></div>
  <div id="sheetPanel"></div>
  <button class="link" type="button" id="closeSheet">Close</button>
</div>
