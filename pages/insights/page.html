<!-- Screen "insights": observations drawn from what was logged. Never a diagnosis. -->
<style>
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--purple-500);outline-offset:2px}
  .screen{width:390px;min-height:calc(100dvh / var(--z,1));margin:0 auto;background:var(--white);
    padding:calc(24px + env(safe-area-inset-top,0px)) 22px 120px}

  .logo{display:flex;align-items:center;gap:9px}
  .logo .mk{width:28px;height:28px}
  .logo .wm{height:26px;width:auto}
  h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-top:14px}
  .sub{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:3px}

  h2{font-size:14px;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
  h2 .count{font-size:11.5px;font-weight:600;color:var(--purple-700);background:var(--purple-50);padding:3px 8px;border-radius:99px}

  .card{border:1px solid var(--line);border-radius:18px;padding:14px 16px}
  .card + .card{margin-top:9px}
  .card .t{font-size:14px;font-weight:700;line-height:1.35}
  .card p{font-size:13px;line-height:1.55;color:var(--body);margin-top:5px}
  .card.expect{background:var(--purple-50);border-color:transparent}
  .card.expect .t{color:var(--purple-900)}
  .card.raise{background:var(--flag-bg);border-color:var(--flag-line)}
  .card.raise .t{display:flex;gap:9px;align-items:flex-start}
  .card.raise .t svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--flag)}

  .empty{border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
  .empty p{font-size:13px;line-height:1.55;color:var(--body);margin-top:6px}
  .empty .t{font-size:14.5px;font-weight:700}

  .disclaimer{margin-top:26px;padding:15px 16px;border-radius:18px;background:var(--purple-50);display:flex;gap:12px}
  .disclaimer .ic{flex:none;width:30px;height:30px;border-radius:10px;background:var(--purple-100);color:var(--purple-700);display:grid;place-items:center}
  .disclaimer .ic svg{width:16px;height:16px}
  .disclaimer b{display:block;font-size:13.5px;font-weight:700;color:var(--purple-900)}
  .disclaimer p{font-size:12.5px;line-height:1.55;color:var(--body);margin-top:3px}

  .ask{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:12px;
    border-radius:15px;background:var(--button);color:#fff;font-size:14.5px;font-weight:600;text-decoration:none}
  .ask svg{width:17px;height:17px}
</style>
